        <div class="janelas"></div>

      <div class="predio p-gcpd">

      </div>
      <div class="predio p3">
        <div class="janelas"></div>
      </div>
      <div class="predio p4">
        <div class="janelas"></div>
      </div>
    </div>
  </div>


  <div class="controles">
    <p id="aviso">🌧️ Noite chuvosa em Gotham City. O Bat-Sinal está desligado.</p>
    <button id="interruptor">🦇 Ligar Bat-Sinal</button>
  </div>

  <script src="script.js" defer></script>
